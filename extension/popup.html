<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Funbridge History Exporter</title>
		<link rel="stylesheet" href="ui/base.css">
		<link rel="stylesheet" href="popup.css">
	</head>
	<body>
		<header>
			<div class="brand">
				<img src="icons/icon-48.png" alt="">
				<h1 data-i18n="extShortName">Funbridge Exporter</h1>
			</div>
			<button id="settings" type="button" class="quiet icon" data-i18n-label="settings">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
			</button>
		</header>

		<main>
			<section id="connection" class="card panel" aria-live="polite">
				<div class="status-line">
					<span id="connection-dot" class="dot"></span>
					<strong id="connection-title" data-i18n="checking">Checking…</strong>
				</div>
				<p id="connection-detail" class="muted small"></p>
				<button id="main-action" type="button" class="primary wide" disabled></button>
				<p id="destinations" class="muted small center"></p>
			</section>

			<section id="running" class="card panel" aria-live="polite" hidden>
				<div class="status-line">
					<span id="running-dot" class="dot busy"></span>
					<strong id="running-title"></strong>
					<span id="running-count" class="count"></span>
				</div>
				<div id="running-bar" class="bar"><span></span></div>
				<p id="running-detail" class="muted small ellipsis"></p>
				<div class="row">
					<button id="show-progress" type="button" class="primary grow" data-i18n="showProgress">Show progress</button>
					<button id="cancel" type="button" data-i18n="cancel">Cancel</button>
				</div>
			</section>

			<section id="last-run" class="last-run" hidden>
				<div>
					<span class="muted small" data-i18n="lastExport">Last export</span>
					<p id="last-run-text" class="small"></p>
				</div>
				<button id="last-run-details" type="button" class="quiet small" data-i18n="details">Details</button>
			</section>
		</main>
		<script type="module" src="popup.js"></script>
	</body>
</html>
